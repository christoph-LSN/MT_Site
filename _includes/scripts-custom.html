<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
  #map-export-wrapper {
    background: #ffffff;
    padding: 20px;
  }

  #map-export-header {
    margin-bottom: 20px;
  }

  #map-export-wrapper .map-title {
    margin-top: 0;
    margin-bottom: 20px;
    font-size: 2rem;
    line-height: 1.3;
  }

  #map-export-source {
    margin-top: 16px;
    font-size: 0.95rem;
    line-height: 1.4;
    word-break: break-word;
  }

  #map-image-download {
    margin-top: 1rem;
  }
</style>

<script>
(function () {
  'use strict';

  /*
    ============================================================
    KONFIGURATION
    ============================================================
  */
  const EXPORT_SCALE = 1.2;
  const EXPORT_TYPE = 'image/jpeg';
  const EXPORT_QUALITY = 0.82;
  const TILE_WAIT_TIMEOUT = 1500;

  /*
    ============================================================
    DATEINAMEN BAUEN
    ============================================================
  */
  function getMapFileName() {
    const heading = document.getElementById('map-heading');

    if (!heading) {
      return 'karte.jpg';
    }

    const cleanName = heading.textContent
      .trim()
      .toLowerCase()
      .replace(/[^\wäöüß\- ]/gi, '')
      .replace(/\s+/g, '-');

    return cleanName + '.jpg';
  }

  /*
    ============================================================
    WARTEFUNKTION
    ============================================================
  */
  function wait(ms) {
    return new Promise(function (resolve) {
      setTimeout(resolve, ms);
    });
  }

  /*
    ============================================================
    AUF LEAFLET-TILES WARTEN
    ============================================================
  */
  async function waitForLeafletTiles(container, timeoutMs) {
    const start = Date.now();

    while (Date.now() - start < timeoutMs) {
      const images = container.querySelectorAll('.leaflet-tile');

      if (images.length === 0) {
        await wait(150);
        continue;
      }

      let loadedCount = 0;

      images.forEach(function (img) {
        if (img.complete) {
          loadedCount++;
        }
      });

      if (loadedCount / images.length > 0.9) {
        return true;
      }

      await wait(150);
    }

    return false;
  }

  /*
    ============================================================
    TILE-BILDER FÜR EXPORT VORBEREITEN
    ============================================================
  */
  function prepareTileImagesForExport(container) {
    const tileImages = container.querySelectorAll('.leaflet-tile');

    tileImages.forEach(function (img) {
      try {
        img.crossOrigin = 'anonymous';
        img.setAttribute('crossorigin', 'anonymous');
      } catch (e) {
        // absichtlich leer
      }
    });
  }

  /*
    ============================================================
    DOWNLOAD STARTEN
    ============================================================
  */
  function downloadData(data, filename, isBlob) {
    const link = document.createElement('a');

    if (isBlob) {
      const url = URL.createObjectURL(data);
      link.href = url;
      link.download = filename;

      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 1000);
    } else {
      link.href = data;
      link.download = filename;

      document.body.appendChild(link);
      link.click();
      link.remove();
    }
  }

  /*
    ============================================================
    CANVAS EXPORTIEREN
    ============================================================
  */
  function exportCanvas(canvas, filename) {
    return new Promise(function (resolve, reject) {
      try {
        canvas.toBlob(function (blob) {
          if (blob) {
            downloadData(blob, filename, true);
            resolve(true);
            return;
          }

          try {
            const dataUrl = canvas.toDataURL(EXPORT_TYPE, EXPORT_QUALITY);
            downloadData(dataUrl, filename, false);
            resolve(true);
          } catch (error) {
            reject(error);
          }
        }, EXPORT_TYPE, EXPORT_QUALITY);
      } catch (error) {
        try {
          const dataUrl = canvas.toDataURL(EXPORT_TYPE, EXPORT_QUALITY);
          downloadData(dataUrl, filename, false);
          resolve(true);
        } catch (fallbackError) {
          reject(fallbackError);
        }
      }
    });
  }

  /*
    ============================================================
    EXPORTFUNKTION
    ============================================================
  */
  async function downloadMapBlockAsImage() {
    const exportWrapper = document.getElementById('map-export-wrapper');
    const mapContainer = document.getElementById('map');
    const button = document.getElementById('btnSaveMapImage');

    if (!exportWrapper) {
      alert('Der Export-Bereich #map-export-wrapper wurde nicht gefunden.');
      return;
    }

    if (!mapContainer) {
      alert('Der Kartenbereich #map wurde nicht gefunden.');
      return;
    }

    if (typeof html2canvas === 'undefined') {
      alert('html2canvas wurde nicht geladen.');
      return;
    }

    if (button) {
      button.disabled = true;
      button.textContent = 'Export läuft...';
    }

    try {
      prepareTileImagesForExport(mapContainer);
      await waitForLeafletTiles(mapContainer, TILE_WAIT_TIMEOUT);

      const rect = exportWrapper.getBoundingClientRect();

      const canvas = await html2canvas(exportWrapper, {
        backgroundColor: '#ffffff',
        scale: EXPORT_SCALE,
        useCORS: true,
        allowTaint: false,
        logging: false,
        imageTimeout: 2000,
        foreignObjectRendering: false,
        width: Math.ceil(rect.width),
        height: Math.ceil(rect.height),
        scrollX: 0,
        scrollY: 0,

        onclone: function (clonedDocument) {
          const clonedWrapper = clonedDocument.getElementById('map-export-wrapper');
          if (!clonedWrapper) return;

          const selectorsToHide = [
            '.leaflet-control-zoom',
            '.leaflet-control-search',
            '.leaflet-control-fullscreen',
            '.leaflet-control-attribution',
            '.leaflet-bar.timecontrol',
            '.leaflet-control-timecontrol',
            '.leaflet-control-container .leaflet-bottom.leaflet-left .leaflet-control',
            '.leaflet-control-container .leaflet-bottom.leaflet-right .leaflet-control'
          ];

          selectorsToHide.forEach(function (selector) {
            clonedWrapper.querySelectorAll(selector).forEach(function (el) {
              if (el.classList.contains('legend')) return;
              if (el.classList.contains('map-legend')) return;
              if (el.classList.contains('info')) return;
              if (el.closest('.legend')) return;
              if (el.closest('.map-legend')) return;

              el.style.display = 'none';
            });
          });
        }
      });

      await exportCanvas(canvas, getMapFileName());

    } catch (error) {
      console.error('Exportfehler:', error);
      alert(
        'Der Download konnte nicht gestartet werden.\n\n' +
        'Falls der Kartenhintergrund fehlt oder der Export hängen bleibt,\n' +
        'liegt das sehr wahrscheinlich an externen Leaflet-Kacheln (CORS).'
      );
    } finally {
      if (button) {
        button.disabled = false;
        button.textContent = 'Karte als JPG herunterladen';
      }
    }
  }

  /*
    ============================================================
    BUTTON VERBINDEN
    ============================================================
  */
  function initMapExportButton() {
    const button = document.getElementById('btnSaveMapImage');

    if (!button) {
      console.warn('Button #btnSaveMapImage wurde nicht gefunden.');
      return;
    }

    if (button.dataset.exportBound === 'true') {
      return;
    }

    button.textContent = 'Karte als JPG herunterladen';

    button.addEventListener('click', function () {
      downloadMapBlockAsImage();
    });

    button.dataset.exportBound = 'true';
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initMapExportButton);
  } else {
    initMapExportButton();
  }
})();
</script>
