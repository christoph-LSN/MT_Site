<script src="https://cdn.datatables.net/buttons/2.2.3/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.2.3/js/buttons.print.min.js"></script>

<style>
  /* =========================================================
     EXPORTBLOCK
     ========================================================= */
  #map-export-wrapper {
    background: #ffffff;
    padding: 20px;
  }

  #map-export-header {
    margin-bottom: 20px;
  }

  #map-export-wrapper .map-title {
    margin-top: 0;
    margin-bottom: 20px;
    font-size: 2rem;
    line-height: 1.3;
  }

  #map-export-source {
    margin-top: 16px;
    font-size: 0.95rem;
    line-height: 1.4;
    word-break: break-word;
  }

  /* =========================================================
     BUTTON-LEISTE DIREKT AM VORHANDENEN GEOJSON-BUTTON
     ========================================================= */
  #map-inline-action-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 12px;
    align-items: center;
  }

  #map-inline-action-row .btn,
  #map-inline-action-row button,
  #map-inline-action-row a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 42px;
    padding: 8px 16px;
    border: 1px solid #00843d;
    background-color: #00843d;
    color: #ffffff !important;
    text-decoration: none !important;
    border-radius: 0;
    cursor: pointer;
    font-size: 1rem;
    line-height: 1.2;
  }

  #map-inline-action-row .btn:hover,
  #map-inline-action-row button:hover,
  #map-inline-action-row a:hover {
    background-color: #006c32;
    border-color: #006c32;
    color: #ffffff !important;
  }

  #map-inline-action-row .btn:disabled,
  #map-inline-action-row button:disabled {
    opacity: 0.75;
    cursor: wait;
  }
</style>

<script>
(function () {
  'use strict';

  var JPEG_QUALITY = 0.90;

  /* ============================================================
     HILFSFUNKTIONEN
     ============================================================ */
  function wait(ms) {
    return new Promise(function (resolve) {
      setTimeout(resolve, ms);
    });
  }

  function getMapFileName() {
    var heading = document.getElementById('map-heading');

    if (!heading) {
      return 'karte.jpg';
    }

    var cleanName = heading.textContent
      .trim()
      .toLowerCase()
      .replace(/[^\wäöüß\- ]/gi, '')
      .replace(/\s+/g, '-');

    return cleanName + '.jpg';
  }

  function downloadBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');

    link.href = url;
    link.download = filename;

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(function () {
      URL.revokeObjectURL(url);
    }, 1000);
  }

  /* ============================================================
     VORHANDENEN GEOJSON-BUTTON FINDEN
     ============================================================
     Wir suchen bewusst breit, weil der Button je nach Renderlogik
     leicht unterschiedlich eingebunden sein kann.
  */
  function findExistingGeoJsonButton() {
    return (
      document.querySelector('#map-export-wrapper a[download].btn-download') ||
      document.querySelector('#map-export-wrapper a[download]') ||
      document.querySelector('a[download].btn-download[title*="GeoJSON"]') ||
      document.querySelector('a[download][title*="GeoJSON"]') ||
      document.querySelector('a[download][aria-label*="GeoJSON"]')
    );
  }

  /* ============================================================
     JPEG-BUTTON ERZEUGEN
     ============================================================ */
  function createJpegButton() {
    var existing = document.getElementById('btnSaveMapImage');
    if (existing) {
      return existing;
    }

    var button = document.createElement('button');
    button.id = 'btnSaveMapImage';
    button.type = 'button';
    button.className = 'btn btn-primary map-jpeg-export-btn';
    button.textContent = 'Karte als JPEG herunterladen';

    return button;
  }

  /* ============================================================
     GEOJSON-BUTTON + JPEG-BUTTON IN EINE LEISTE SETZEN
     ============================================================ */
  function placeButtonsInline() {
    var geoJsonButton = findExistingGeoJsonButton();
    if (!geoJsonButton) {
      return null;
    }

    var actionRow = document.getElementById('map-inline-action-row');
    if (!actionRow) {
      actionRow = document.createElement('div');
      actionRow.id = 'map-inline-action-row';
    }

    /*
      Falls die Leiste noch nicht im DOM ist:
      genau an die Stelle des vorhandenen GeoJSON-Buttons setzen.
    */
    if (!actionRow.parentNode && geoJsonButton.parentNode) {
      geoJsonButton.parentNode.insertBefore(actionRow, geoJsonButton);
    }

    /*
      Vorhandenen GeoJSON-Button in die Leiste verschieben
    */
    if (!actionRow.contains(geoJsonButton)) {
      actionRow.appendChild(geoJsonButton);
    }

    /*
      JPEG-Button daneben setzen
    */
    var jpegButton = createJpegButton();
    if (!actionRow.contains(jpegButton)) {
      actionRow.appendChild(jpegButton);
    }

    return {
      actionRow: actionRow,
      geoJsonButton: geoJsonButton,
      jpegButton: jpegButton
    };
  }

  /* ============================================================
     STÖRENDE ELEMENTE FÜR DEN SCREENSHOT AUSBLENDEN
     ============================================================ */
  function hideElementsForCapture() {
    var selectors = [
      '#map-inline-action-row',
      '#map-export-wrapper .leaflet-control-fullscreen',
      '#map-export-wrapper .leaflet-control-search',
      '#map-export-wrapper .leaflet-control-attribution',
      '#map-export-wrapper .disaggregation-controls',
      '#map-export-wrapper .leaflet-bar-timecontrol'
    ];

    var changed = [];

    selectors.forEach(function (selector) {
      document.querySelectorAll(selector).forEach(function (el) {
        changed.push({
          element: el,
          oldDisplay: el.style.display
        });

        el.style.display = 'none';
      });
    });

    return function restore() {
      changed.forEach(function (entry) {
        entry.element.style.display = entry.oldDisplay;
      });
    };
  }

  /* ============================================================
     EXPORTBEREICH IN EINE STABILE POSITION SCROLLEN
     ============================================================ */
  async function scrollElementIntoStableCapturePosition(element) {
    var oldScrollX = window.scrollX;
    var oldScrollY = window.scrollY;

    var targetTop = window.scrollY + element.getBoundingClientRect().top - 20;
    if (targetTop < 0) {
      targetTop = 0;
    }

    window.scrollTo({
      top: targetTop,
      left: 0,
      behavior: 'auto'
    });

    await wait(350);
    await wait(250);

    return function restoreScrollPosition() {
      window.scrollTo({
        top: oldScrollY,
        left: oldScrollX,
        behavior: 'auto'
      });
    };
  }

  /* ============================================================
     SCREENSHOT DES AKTUELLEN TABS UND CROP AUF
     #map-export-wrapper
     ============================================================ */
  async function captureExactElement(selector) {
    var element = document.querySelector(selector);

    if (!element) {
      throw new Error('Element "' + selector + '" wurde nicht gefunden.');
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
      throw new Error('Die Bildschirmfreigabe wird von diesem Browser nicht unterstützt.');
    }

    var restoreHiddenElements = hideElementsForCapture();
    var restoreScrollPosition = null;

    try {
      restoreScrollPosition = await scrollElementIntoStableCapturePosition(element);
      await wait(200);

      var stream = await navigator.mediaDevices.getDisplayMedia({
        video: {
          frameRate: 1
        },
        audio: false,
        preferCurrentTab: true,
        selfBrowserSurface: 'include'
      });

      var video = document.createElement('video');
      video.style.position = 'fixed';
      video.style.left = '-10000px';
      video.style.top = '-10000px';
      video.muted = true;
      video.playsInline = true;
      video.srcObject = stream;

      document.body.appendChild(video);

      try {
        await video.play();
        await wait(400);

        var frameWidth = video.videoWidth;
        var frameHeight = video.videoHeight;

        if (!frameWidth || !frameHeight) {
          throw new Error('Es konnte kein Videoframe aus dem Tab gelesen werden.');
        }

        var fullCanvas = document.createElement('canvas');
        fullCanvas.width = frameWidth;
        fullCanvas.height = frameHeight;

        var fullCtx = fullCanvas.getContext('2d');
        fullCtx.drawImage(video, 0, 0, frameWidth, frameHeight);

        var rect = element.getBoundingClientRect();

        var viewportWidth = window.innerWidth;
        var viewportHeight = window.innerHeight;

        if (window.visualViewport) {
          viewportWidth = window.visualViewport.width;
          viewportHeight = window.visualViewport.height;
        }

        var scaleX = frameWidth / viewportWidth;
        var scaleY = frameHeight / viewportHeight;

        var viewportOffsetLeft = window.visualViewport ? window.visualViewport.offsetLeft : 0;
        var viewportOffsetTop = window.visualViewport ? window.visualViewport.offsetTop : 0;

        var cropX = Math.round((rect.left - viewportOffsetLeft) * scaleX);
        var cropY = Math.round((rect.top - viewportOffsetTop) * scaleY);
        var cropWidth = Math.round(rect.width * scaleX);
        var cropHeight = Math.round(rect.height * scaleY);

        cropX = Math.max(0, cropX);
        cropY = Math.max(0, cropY);
        cropWidth = Math.max(1, Math.min(cropWidth, frameWidth - cropX));
        cropHeight = Math.max(1, Math.min(cropHeight, frameHeight - cropY));

        var croppedCanvas = document.createElement('canvas');
        croppedCanvas.width = cropWidth;
        croppedCanvas.height = cropHeight;

        var croppedCtx = croppedCanvas.getContext('2d');
        croppedCtx.drawImage(
          fullCanvas,
          cropX, cropY, cropWidth, cropHeight,
          0, 0, cropWidth, cropHeight
        );

        return croppedCanvas;

      } finally {
        if (stream) {
          stream.getTracks().forEach(function (track) {
            track.stop();
          });
        }

        if (video && video.parentNode) {
          video.parentNode.removeChild(video);
        }
      }

    } finally {
      restoreHiddenElements();

      if (restoreScrollPosition) {
        restoreScrollPosition();
      }
    }
  }

  /* ============================================================
     EXPORT NUR VON #map-export-wrapper
     ============================================================ */
  async function downloadCurrentMapDivAsJpeg() {
    var button = document.getElementById('btnSaveMapImage');

    if (button) {
      button.disabled = true;
      button.textContent = 'Aktuellen Tab freigeben...';
    }

    try {
      var canvas = await captureExactElement('#map-export-wrapper');

      await new Promise(function (resolve, reject) {
        canvas.toBlob(function (blob) {
          if (!blob) {
            reject(new Error('Das JPEG konnte nicht erzeugt werden.'));
            return;
          }

          downloadBlob(blob, getMapFileName());
          resolve(true);
        }, 'image/jpeg', JPEG_QUALITY);
      });

    } catch (error) {
      console.error('Screenshot-Exportfehler:', error);

      alert(
        'Der Export konnte nicht erstellt werden.\n\n' +
        'Bitte im Freigabedialog den aktuellen Browser-Tab auswählen.'
      );
    } finally {
      var buttonReset = document.getElementById('btnSaveMapImage');
      if (buttonReset) {
        buttonReset.disabled = false;
        buttonReset.textContent = 'Karte als JPEG herunterladen';
      }
    }
  }

  /* ============================================================
     INITIALISIERUNG
     ============================================================
     Falls der GeoJSON-Button später nachgeladen wird:
     beobachten und dann die Leiste aufbauen.
  */
  function initMapExport() {
    var placed = placeButtonsInline();

    if (placed && placed.jpegButton) {
      bindJpegButton(placed.jpegButton);
      return;
    }

    var observer = new MutationObserver(function () {
      var retryPlaced = placeButtonsInline();
      if (retryPlaced && retryPlaced.jpegButton) {
        bindJpegButton(retryPlaced.jpegButton);
        observer.disconnect();
      }
    });

    observer.observe(document.body, {
      childList: true,
      subtree: true
    });
  }

  function bindJpegButton(jpegButton) {
    if (!jpegButton) {
      return;
    }

    if (jpegButton.dataset.exportBound === 'true') {
      return;
    }

    jpegButton.addEventListener('click', function () {
      downloadCurrentMapDivAsJpeg();
    });

    jpegButton.dataset.exportBound = 'true';
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initMapExport);
  } else {
    initMapExport();
  }
})();
</script>
