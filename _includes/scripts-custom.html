<style>
  /* =========================================================
     EXPORTBLOCK
     ========================================================= */
  #map-export-wrapper {
    background: #ffffff;
    padding: 20px;
  }

  #map-export-header {
    margin-bottom: 20px;
  }

  #map-export-wrapper .map-title {
    margin-top: 0;
    margin-bottom: 20px;
    font-size: 2rem;
    line-height: 1.3;
  }

  #map-export-source {
    margin-top: 16px;
    font-size: 0.95rem;
    line-height: 1.4;
    word-break: break-word;
  }

  /* =========================================================
     BUTTONS: nebeneinander + grün
     ========================================================= */
  #map-action-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 16px;
    align-items: center;
  }

  #map-action-row .btn,
  #map-action-row button,
  #map-action-row a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 42px;
    padding: 8px 16px;
    border: 1px solid #00843d;
    background-color: #00843d;
    color: #ffffff !important;
    text-decoration: none !important;
    border-radius: 0;
    cursor: pointer;
    font-size: 1rem;
    line-height: 1.2;
  }

  #map-action-row .btn:hover,
  #map-action-row button:hover,
  #map-action-row a:hover {
    background-color: #006c32;
    border-color: #006c32;

  }

  #map-action-row .btn:disabled,
  #map-action-row button:disabled {
    opacity: 0.75;
    cursor: wait;
  }
</style>

<script>
(function () {
  'use strict';

  /* =========================================================
     KONFIGURATION
     ========================================================= */
  const EXPORT_SCALE = 1;            // bewusst moderat für schnelleren Export
  const JPEG_QUALITY = 0.86;
  const TILE_WAIT_TIMEOUT = 2500;    // nur kurz auf Kartenkacheln warten
  const PAGE_PADDING = 20;
  const TITLE_FONT = 'normal 28px Arial, sans-serif';
  const BODY_FONT = 'normal 14px Arial, sans-serif';
  const SOURCE_FONT = 'normal 14px Arial, sans-serif';
  const TEXT_COLOR = '#222222';
  const SOURCE_COLOR = '#1a5fb4';

  /* =========================================================
     LEAFLET-MAP-REFERENZ EINFANGEN
     =========================================================
     Falls die Karte bereits global erreichbar ist, versuchen wir sie
     zu finden. Falls nicht, fangen wir zukünftig erzeugte Karten ab.
  */
  window.__capturedLeafletMaps = window.__capturedLeafletMaps || [];

  function installLeafletMapCapture() {
    if (!window.L || !window.L.map || window.__leafletMapCaptureInstalled) {
      return;
    }

    const originalMapFactory = window.L.map;

    window.L.map = function () {
      const map = originalMapFactory.apply(this, arguments);
      try {
        window.__capturedLeafletMaps.push(map);
      } catch (e) {
        // absichtlich leer
      }
      return map;
    };

    window.__leafletMapCaptureInstalled = true;
  }

  installLeafletMapCapture();

  /* =========================================================
     HILFSFUNKTIONEN
     ========================================================= */

  function wait(ms) {
    return new Promise(function (resolve) {
      setTimeout(resolve, ms);
    });
  }

  function getMapFileName() {
    const heading = document.getElementById('map-heading');

    if (!heading) {
      return 'karte.jpg';
    }

    const cleanName = heading.textContent
      .trim()
      .toLowerCase()
      .replace(/[^\wäöüß\- ]/gi, '')
      .replace(/\s+/g, '-');

    return cleanName + '.jpg';
  }

  function getTextFromElement(selector) {
    const el = document.querySelector(selector);
    return el ? el.innerText.trim() : '';
  }

  function getFootnoteText() {
    const footer = document.getElementById('mapFooter');
    if (!footer) return '';

    const clone = footer.cloneNode(true);

    /*
      Sicherheitshalber alle Buttons/Links/Formularelemente entfernen,
      damit nichts wie "im GeoJSON-Format speichern" im Text landet.
    */
    clone.querySelectorAll('button, .btn, a.btn, input[type="button"], input[type="submit"]').forEach(function (el) {
      el.remove();
    });

    return clone.innerText.trim();
  }

  function prepareTileImagesForExport(container) {
    container.querySelectorAll('.leaflet-tile').forEach(function (img) {
      try {
        img.crossOrigin = 'anonymous';
        img.setAttribute('crossorigin', 'anonymous');
      } catch (e) {
        // absichtlich leer
      }
    });
  }

  async function waitForLeafletTiles(container, timeoutMs) {
    const start = Date.now();

    while (Date.now() - start < timeoutMs) {
      const images = container.querySelectorAll('.leaflet-tile');

      if (images.length === 0) {
        await wait(150);
        continue;
      }

      let loaded = 0;
      images.forEach(function (img) {
        if (img.complete) loaded++;
      });

      if (loaded / images.length > 0.9) {
        return true;
      }

      await wait(150);
    }

    return false;
  }

  /*
    Sucht eine sichtbare Legende innerhalb des Kartenbereichs.
    Falls keine Legende existiert, gibt die Funktion null zurück.
  */
  function findLegendElement() {
    const candidates = document.querySelectorAll(
      '#map .legend, ' +
      '#map .map-legend, ' +
      '#map .leaflet-control.legend, ' +
      '#map .leaflet-control .legend, ' +
      '#map .info.legend, ' +
      '#map .leaflet-top.leaflet-right .leaflet-control'
    );

    for (let i = 0; i < candidates.length; i++) {
      const el = candidates[i];
      const rect = el.getBoundingClientRect();

      if (
        rect.width > 20 &&
        rect.height > 20 &&
        window.getComputedStyle(el).display !== 'none' &&
        window.getComputedStyle(el).visibility !== 'hidden'
      ) {
        return el;
      }
    }

    return null;
  }

  /*
    Versucht, die Leaflet-Map-Instanz zu finden.
    1) zuerst bereits eingefangene Maps
    2) dann globale Window-Variablen
    3) dann einfache Suche in globalen Objekten
  */
  function findLeafletMapInstance() {
    const mapContainer = document.getElementById('map');
    if (!mapContainer || !window.L || !window.L.Map) {
      return null;
    }

    // 1) bereits gespeicherte Maps bevorzugen
    if (window.__capturedLeafletMaps.length) {
      for (let i = window.__capturedLeafletMaps.length - 1; i >= 0; i--) {
        const map = window.__capturedLeafletMaps[i];
        if (map && map.getContainer && map.getContainer() === mapContainer) {
          return map;
        }
      }
      // falls Container-Vergleich fehlschlägt, letzte Karte als Fallback
      return window.__capturedLeafletMaps[window.__capturedLeafletMaps.length - 1];
    }

    // 2) globale Variablen durchsuchen
    for (const key in window) {
      try {
        const value = window[key];
        if (value instanceof window.L.Map) {
          if (value.getContainer && value.getContainer() === mapContainer) {
            return value;
          }
        }
      } catch (e) {
        // absichtlich ignorieren
      }
    }

    // 3) flache Suche in globalen Objekten
    for (const key in window) {
      try {
        const obj = window[key];
        if (!obj || typeof obj !== 'object') continue;

        for (const subKey in obj) {
          try {
            const value = obj[subKey];
            if (value instanceof window.L.Map) {
              if (value.getContainer && value.getContainer() === mapContainer) {
                return value;
              }
            }
          } catch (e) {
            // absichtlich ignorieren
          }
        }
      } catch (e) {
        // absichtlich ignorieren
      }
    }

    return null;
  }

  /*
    Text im Canvas sauber umbrechen
  */
  function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    if (!text) {
      return y;
    }

    const paragraphs = text.split('\n');
    let currentY = y;

    paragraphs.forEach(function (paragraph, paragraphIndex) {
      const words = paragraph.split(/\s+/);
      let line = '';

      words.forEach(function (word) {
        const testLine = line ? line + ' ' + word : word;
        const metrics = ctx.measureText(testLine);

        if (metrics.width > maxWidth && line) {
          ctx.fillText(line, x, currentY);
          currentY += lineHeight;
          line = word;
        } else {
          line = testLine;
        }
      });

      if (line) {
        ctx.fillText(line, x, currentY);
        currentY += lineHeight;
      }

      // Absatzabstand
      if (paragraphIndex < paragraphs.length - 1) {
        currentY += 4;
      }
    });

    return currentY;
  }

  /*
    Legende separat als Canvas rendern
  */
  async function renderLegendCanvas(legendElement) {
    if (!legendElement || typeof html2canvas === 'undefined') {
      return null;
    }

    return await html2canvas(legendElement, {
      backgroundColor: null,
      scale: 1,
      useCORS: true,
      allowTaint: false,
      logging: false
    });
  }

  /*
    Karte exakt mit leaflet-image rendern
  */
  function renderLeafletMapCanvas(map) {
    return new Promise(function (resolve, reject) {
      if (!window.leafletImage) {
        reject(new Error('leaflet-image wurde nicht geladen.'));
        return;
      }

      window.leafletImage(map, function (err, canvas) {
        if (err) {
          reject(err);
          return;
        }

        resolve(canvas);
      });
    });
  }

  /*
    Download starten
  */
  function downloadCanvasAsJpeg(canvas, filename) {
    return new Promise(function (resolve, reject) {
      try {
        canvas.toBlob(function (blob) {
          if (!blob) {
            reject(new Error('Kein Blob erzeugt.'));
            return;
          }

          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');

          link.href = url;
          link.download = filename;

          document.body.appendChild(link);
          link.click();
          link.remove();

          setTimeout(function () {
            URL.revokeObjectURL(url);
          }, 1000);

          resolve(true);
        }, 'image/jpeg', JPEG_QUALITY);
      } catch (error) {
        reject(error);
      }
    });
  }

  /*
    Bestehenden GeoJSON-Button in die Aktionsleiste verschieben
  */
  function moveGeoJsonButtonIntoActionRow() {
    const actionRow = document.getElementById('map-action-row');
    if (!actionRow) return;

    // Mögliche Container/Buttons suchen
    const geoJsonWrapper =
      document.getElementById('mapSelectionDownload') ||
      document.querySelector('.download_geojson') ||
      document.querySelector('#map .btn-download') ||
      document.querySelector('button#btnSaveMap')?.parentElement;

    if (!geoJsonWrapper) return;

    // Schon verschoben?
    if (actionRow.contains(geoJsonWrapper)) return;

    actionRow.appendChild(geoJsonWrapper);

    // Grün formatieren
    geoJsonWrapper.querySelectorAll('button, .btn, a').forEach(function (el) {
      el.classList.add('map-action-btn');
    });
  }

  /*
    Falls der GeoJSON-Button später per JS eingefügt wird:
    beobachten und dann verschieben.
  */
  function observeGeoJsonButton() {
    const mapContainer = document.getElementById('map');
    if (!mapContainer) return;

    moveGeoJsonButtonIntoActionRow();

    const observer = new MutationObserver(function () {
      moveGeoJsonButtonIntoActionRow();
    });

    observer.observe(document.body, {
      childList: true,
      subtree: true
    });
  }

  /* =========================================================
     HAUPTEXPORT
     ========================================================= */
  async function downloadMapAsJpeg() {
    const button = document.getElementById('btnSaveMapImage');
    const mapContainer = document.getElementById('map');

    if (!mapContainer) {
      alert('Der Kartencontainer #map wurde nicht gefunden.');
      return;
    }

    const map = findLeafletMapInstance();
    if (!map) {
      alert('Die Leaflet-Karteninstanz konnte nicht gefunden werden.');
      return;
    }

    if (button) {
      button.disabled = true;
      button.textContent = 'Export läuft...';
    }

    try {
      prepareTileImagesForExport(mapContainer);
      await waitForLeafletTiles(mapContainer, TILE_WAIT_TIMEOUT);

      const mapRect = mapContainer.getBoundingClientRect();
      const titleText = getTextFromElement('#map-heading');
      const footnoteText = getFootnoteText();
      const sourceText = getTextFromElement('#map-source-text');
      const legendElement = findLegendElement();

      // 1) Exakte Kartenrenderung
      const mapCanvas = await renderLeafletMapCanvas(map);

      // 2) Legende separat rendern (wenn vorhanden)
      let legendCanvas = null;
      let legendRect = null;
      if (legendElement) {
        legendCanvas = await renderLegendCanvas(legendElement);
        legendRect = legendElement.getBoundingClientRect();
      }

      // 3) Finales Canvas zusammenbauen
      const exportWidth = Math.max(1000, Math.round(mapRect.width));
      const drawScale = exportWidth / mapCanvas.width;
      const finalMapWidth = Math.round(mapCanvas.width * drawScale);
      const finalMapHeight = Math.round(mapCanvas.height * drawScale);

      // Hilfs-Canvas zum Höhenabschätzen
      const measureCanvas = document.createElement('canvas');
      const measureCtx = measureCanvas.getContext('2d');

      measureCtx.font = TITLE_FONT;
      const titleLineHeight = 36;

      measureCtx.font = BODY_FONT;
      const bodyLineHeight = 20;

      measureCtx.font = SOURCE_FONT;
      const sourceLineHeight = 20;

      // Grobe Höhenberechnung
      const contentWidth = exportWidth - PAGE_PADDING * 2;
      let estimatedHeight = 0;
      estimatedHeight += PAGE_PADDING;           // oben
      estimatedHeight += titleLineHeight + 12;   // Titelblock
      estimatedHeight += finalMapHeight;         // Karte
      estimatedHeight += 24;                     // Abstand zur Fußnote
      estimatedHeight += 140;                    // Reserve für Fußnote
      estimatedHeight += 40;                     // Quelle
      estimatedHeight += PAGE_PADDING;           // unten

      const finalCanvas = document.createElement('canvas');
      finalCanvas.width = exportWidth * EXPORT_SCALE;
      finalCanvas.height = estimatedHeight * EXPORT_SCALE;

      const ctx = finalCanvas.getContext('2d');
      ctx.scale(EXPORT_SCALE, EXPORT_SCALE);

      // Hintergrund
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, exportWidth, estimatedHeight);

      // Titel
      let currentY = PAGE_PADDING;
      ctx.fillStyle = TEXT_COLOR;
      ctx.font = TITLE_FONT;
      currentY = wrapText(ctx, titleText, PAGE_PADDING, currentY + 28, contentWidth, titleLineHeight);
      currentY += 12;

      // Karte
      const mapX = PAGE_PADDING;
      const mapY = currentY;
      ctx.drawImage(mapCanvas, mapX, mapY, finalMapWidth, finalMapHeight);

      // Legende oben rechts auf die Karte legen
      if (legendCanvas && legendRect) {
        const relativeLeft = legendRect.left - mapRect.left;
        const relativeTop = legendRect.top - mapRect.top;

        const drawLegendX = mapX + Math.round(relativeLeft * drawScale);
        const drawLegendY = mapY + Math.round(relativeTop * drawScale);
        const drawLegendW = Math.round(legendRect.width * drawScale);
        const drawLegendH = Math.round(legendRect.height * drawScale);

        ctx.drawImage(legendCanvas, drawLegendX, drawLegendY, drawLegendW, drawLegendH);
      }

      currentY = mapY + finalMapHeight + 24;

      // Fußnote
      if (footnoteText) {
        ctx.fillStyle = TEXT_COLOR;
        ctx.font = BODY_FONT;
        currentY = wrapText(ctx, footnoteText, PAGE_PADDING, currentY, contentWidth, bodyLineHeight);
        currentY += 12;
      }

      // Quelle
      if (sourceText) {
        ctx.fillStyle = TEXT_COLOR;
        ctx.font = 'bold 14px Arial, sans-serif';
        ctx.fillText('Quelle:', PAGE_PADDING, currentY);

        const labelWidth = ctx.measureText('Quelle:').width + 6;
        ctx.font = SOURCE_FONT;
        ctx.fillStyle = SOURCE_COLOR;
        ctx.fillText(sourceText, PAGE_PADDING + labelWidth, currentY);

        // leichte Unterstreichung wie Link-Stil
        const sourceWidth = ctx.measureText(sourceText).width;
        ctx.beginPath();
        ctx.moveTo(PAGE_PADDING + labelWidth, currentY + 3);
        ctx.lineTo(PAGE_PADDING + labelWidth + sourceWidth, currentY + 3);
        ctx.strokeStyle = SOURCE_COLOR;
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // Falls die tatsächlich beschriebene Höhe kleiner/größer ist:
      // optional könnte man hier noch trimmen; für Stabilität lassen wir es so.

      await downloadCanvasAsJpeg(finalCanvas, getMapFileName());

    } catch (error) {
      console.error('Exportfehler:', error);
      alert(
