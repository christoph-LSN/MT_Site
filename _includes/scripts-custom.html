<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
  #map-export-wrapper {
    background: #ffffff;
    padding: 20px;
  }

  #map-export-header {
    margin-bottom: 20px;
  }

  #map-export-wrapper .map-title {
    margin-top: 0;
    margin-bottom: 20px;
    font-size: 2rem;
    line-height: 1.3;
  }

  #map-export-source {
    margin-top: 16px;
    font-size: 0.95rem;
    line-height: 1.4;
    word-break: break-word;
  }

  #map-image-download {
    margin-top: 1rem;
  }

  /*
    Falls du irgendwo gezielt Elemente vom Export ausschließen willst,
    kannst du ihnen die Klasse .no-export geben.
  */
  .no-export {
    /* keine Layoutänderung auf der Seite selbst */
  }
</style>

<script>
(function () {
  'use strict';

  /*
    ============================================================
    KONFIGURATION
    ============================================================
  */
  const EXPORT_SCALE = 1.15;          // guter Kompromiss aus Qualität und Geschwindigkeit
  const EXPORT_TYPE = 'image/jpeg';
  const EXPORT_QUALITY = 0.84;
  const TILE_WAIT_TIMEOUT = 1500;

  /*
    ============================================================
    DATEINAME AUS TITEL ERZEUGEN
    ============================================================
  */
  function getMapFileName() {
    const heading = document.getElementById('map-heading');

    if (!heading) {
      return 'karte.jpg';
    }

    const cleanName = heading.textContent
      .trim()
      .toLowerCase()
      .replace(/[^\wäöüß\- ]/gi, '')
      .replace(/\s+/g, '-');

    return cleanName + '.jpg';
  }

  /*
    ============================================================
    KLEINE WARTEFUNKTION
    ============================================================
  */
  function wait(ms) {
    return new Promise(function (resolve) {
      setTimeout(resolve, ms);
    });
  }

  /*
    ============================================================
    AUF LEAFLET-TILES WARTEN
    ============================================================
  */
  async function waitForLeafletTiles(container, timeoutMs) {
    const start = Date.now();

    while (Date.now() - start < timeoutMs) {
      const images = container.querySelectorAll('.leaflet-tile');

      if (images.length === 0) {
        await wait(150);
        continue;
      }

      let loadedCount = 0;

      images.forEach(function (img) {
        if (img.complete) {
          loadedCount++;
        }
      });

      // Wenn der Großteil geladen ist, reicht das für den Export
      if (loadedCount / images.length > 0.9) {
        return true;
      }

      await wait(150);
    }

    return false;
  }

  /*
    ============================================================
    TILE-BILDER FÜR EXPORT VORBEREITEN
    ============================================================
  */
  function prepareTileImagesForExport(container) {
    const tileImages = container.querySelectorAll('.leaflet-tile');

    tileImages.forEach(function (img) {
      try {
        img.crossOrigin = 'anonymous';
        img.setAttribute('crossorigin', 'anonymous');
      } catch (e) {
        // absichtlich leer
      }
    });
  }

  /*
    ============================================================
    TRANSFORM-MATRIX AUSLESEN
    ============================================================
    Leaflet nutzt häufig:
    - matrix(...)
    - matrix3d(...)
    Daraus lesen wir die X-/Y-Verschiebung aus.
  */
  function parseTranslateFromTransform(transformValue) {
    if (!transformValue || transformValue === 'none') {
      return { x: 0, y: 0 };
    }

    // matrix(a, b, c, d, tx, ty)
    const matrix2d = transformValue.match(/^matrix\((.+)\)$/);
    if (matrix2d) {
      const values = matrix2d[1].split(',').map(function (v) {
        return parseFloat(v.trim());
      });

      return {
        x: values[4] || 0,
        y: values[5] || 0
      };
    }

    // matrix3d(...)
    const matrix3d = transformValue.match(/^matrix3d\((.+)\)$/);
    if (matrix3d) {
      const values = matrix3d[1].split(',').map(function (v) {
        return parseFloat(v.trim());
      });

      return {
        x: values[12] || 0,
        y: values[13] || 0
      };
    }

    return { x: 0, y: 0 };
  }

  /*
    ============================================================
    LIVE-DOM: LEAFLET-POSITIONEN AUFNEHMEN
    ============================================================
    Wir merken uns die berechneten Positionen wichtiger Leaflet-Elemente,
    damit wir sie im geklonten DOM stabil reproduzieren können.
  */
  function captureLeafletLayoutSnapshot(mapContainer) {
    const selectors = [
      '.leaflet-map-pane',
      '.leaflet-tile-pane',
      '.leaflet-overlay-pane',
      '.leaflet-shadow-pane',
      '.leaflet-marker-pane',
      '.leaflet-tooltip-pane',
      '.leaflet-popup-pane',
      '.leaflet-tile-container'
    ];

    const snapshot = [];

    selectors.forEach(function (selector) {
      const nodes = mapContainer.querySelectorAll(selector);

      nodes.forEach(function (node, index) {
        const style = window.getComputedStyle(node);
        const translate = parseTranslateFromTransform(style.transform);

        snapshot.push({
          selector: selector,
          index: index,
          x: translate.x,
          y: translate.y,
          width: style.width,
          height: style.height,
          left: style.left,
          top: style.top
        });
      });
    });

    return snapshot;
  }

  /*
    ============================================================
    CLONE: LEAFLET-POSITIONEN WIEDER EINSETZEN
    ============================================================
    Im geklonten DOM entfernen wir transform und setzen dafür left/top.
    Das reduziert den typischen Leaflet-Versatz in html2canvas.
  */
  function applyLeafletLayoutSnapshot(clonedMapContainer, snapshot) {
    snapshot.forEach(function (entry) {
      const nodes = clonedMapContainer.querySelectorAll(entry.selector);
      const node = nodes[entry.index];

      if (!node) return;

      node.style.transform = 'none';
      node.style.webkitTransform = 'none';
      node.style.transition = 'none';
      node.style.animation = 'none';
      node.style.left = entry.x + 'px';
      node.style.top = entry.y + 'px';

      if (entry.width) {
        node.style.width = entry.width;
      }

      if (entry.height) {
        node.style.height = entry.height;
      }
    });

    // Auch einzelne Tiles stabilisieren
    clonedMapContainer.querySelectorAll('.leaflet-tile').forEach(function (tile) {
      tile.style.transform = 'none';
      tile.style.webkitTransform = 'none';
      tile.style.transition = 'none';
      tile.style.animation = 'none';
    });

    // SVG-Overlay explizit oben halten
    clonedMapContainer.querySelectorAll('.leaflet-overlay-pane svg').forEach(function (svg) {
      svg.style.position = 'absolute';
      svg.style.left = '0';
      svg.style.top = '0';
      svg.style.transform = 'none';
      svg.style.webkitTransform = 'none';
    });
  }

  /*
    ============================================================
    EXPORT-UNERWÜNSCHTE ELEMENTE AUSBLENDEN
    ============================================================
    Hier blenden wir im geklonten Export-DOM alles aus,
    was NICHT mit ins Bild soll.
  */
  function hideElementsInClone(clonedWrapper) {
    const selectorsToHide = [
      // Leaflet-Bedienelemente
      '.leaflet-control-zoom',
      '.leaflet-control-search',
      '.leaflet-control-fullscreen',
      '.leaflet-control-attribution',
      '.leaflet-bar.timecontrol',
      '.leaflet-control-timecontrol',

      // Export explizit ausschließen
      '.no-export',

      // GeoJSON-Download
      '#mapSelectionDownload',
      '#btnSaveMap',
      '.btn-download',

      // Sonstige Buttons/Links im Datenfuß
      '#mapFooter button',
      '#mapFooter .btn',
      '#mapFooter a.btn',
      '#mapFooter input[type="button"]',
      '#mapFooter input[type="submit"]',

      // Allgemein alle Buttons innerhalb des Exportbereichs ausblenden
      'button',
      '.btn'
    ];

    selectorsToHide.forEach(function (selector) {
      clonedWrapper.querySelectorAll(selector).forEach(function (el) {
        /*
          Legende nicht ausblenden
        */
        if (el.classList.contains('legend')) return;
        if (el.classList.contains('map-legend')) return;
        if (el.classList.contains('info')) return;
        if (el.closest('.legend')) return;
        if (el.closest('.map-legend')) return;

        el.style.display = 'none';
      });
    });
  }

  /*
    ============================================================
    DOWNLOAD STARTEN
    ============================================================
  */
  function downloadData(data, filename, isBlob) {
    const link = document.createElement('a');

    if (isBlob) {
      const url = URL.createObjectURL(data);
      link.href = url;
      link.download = filename;

      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 1000);
    } else {
      link.href = data;
      link.download = filename;

      document.body.appendChild(link);
      link.click();
      link.remove();
    }
  }

  /*
    ============================================================
    CANVAS EXPORTIEREN
    ============================================================
  */
  function exportCanvas(canvas, filename) {
    return new Promise(function (resolve, reject) {
      try {
        canvas.toBlob(function (blob) {
          if (blob) {
            downloadData(blob, filename, true);
            resolve(true);
            return;
          }

          try {
            const dataUrl = canvas.toDataURL(EXPORT_TYPE, EXPORT_QUALITY);
            downloadData(dataUrl, filename, false);
            resolve(true);
          } catch (error) {
            reject(error);
          }
        }, EXPORT_TYPE, EXPORT_QUALITY);
      } catch (error) {
        try {
          const dataUrl = canvas.toDataURL(EXPORT_TYPE, EXPORT_QUALITY);
          downloadData(dataUrl, filename, false);
          resolve(true);
        } catch (fallbackError) {
          reject(fallbackError);
        }
      }
    });
  }

  /*
    ============================================================
    HAUPTFUNKTION: EXPORT
    ============================================================
  */
  async function downloadMapBlockAsImage() {
    const exportWrapper = document.getElementById('map-export-wrapper');
    const mapContainer = document.getElementById('map');
    const button = document.getElementById('btnSaveMapImage');

    if (!exportWrapper) {
      alert('Der Export-Bereich #map-export-wrapper wurde nicht gefunden.');
      return;
    }

    if (!mapContainer) {
      alert('Der Kartenbereich #map wurde nicht gefunden.');
      return;
    }

    if (typeof html2canvas === 'undefined') {
      alert('html2canvas wurde nicht geladen.');
      return;
    }

    if (button) {
      button.disabled = true;
      button.textContent = 'Export läuft...';
    }

    try {
      prepareTileImagesForExport(mapContainer);
      await waitForLeafletTiles(mapContainer, TILE_WAIT_TIMEOUT);

      // Leaflet-Layout der LIVE-Karte merken
      const leafletSnapshot = captureLeafletLayoutSnapshot(mapContainer);

      const rect = exportWrapper.getBoundingClientRect();

      const canvas = await html2canvas(exportWrapper, {
        backgroundColor: '#ffffff',
        scale: EXPORT_SCALE,
        useCORS: true,
        allowTaint: false,
        logging: false,
        imageTimeout: 2000,
        foreignObjectRendering: false,
        width: Math.ceil(rect.width),
        height: Math.ceil(rect.height),
        scrollX: 0,
        scrollY: 0,

        onclone: function (clonedDocument) {
          const clonedWrapper = clonedDocument.getElementById('map-export-wrapper');
          const clonedMapContainer = clonedDocument.getElementById('map');

          if (!clonedWrapper) return;

          // Unerwünschte Buttons / Controls ausblenden
          hideElementsInClone(clonedWrapper);

          // Leaflet-Layout im Clone korrigieren
          if (clonedMapContainer) {
            applyLeafletLayoutSnapshot(clonedMapContainer, leafletSnapshot);
          }
        }
      });

      await exportCanvas(canvas, getMapFileName());

    } catch (error) {
      console.error('Exportfehler:', error);
      alert(
        'Der Download konnte nicht gestartet werden.\n\n' +
        'Falls der Kartenhintergrund fehlt oder die Karte weiter versetzt erscheint,\n' +
        'liegt das sehr wahrscheinlich an Leaflet-Transforms oder externen Kartenkacheln.'
      );
    } finally {
      if (button) {
        button.disabled = false;
        button.textContent = 'Karte als JPG herunterladen';
      }
    }
  }

  /*
    ============================================================
    BUTTON VERBINDEN
    ============================================================
  */
  function initMapExportButton() {
    const button = document.getElementById('btnSaveMapImage');

    if (!button) {
      console.warn('Button #btnSaveMapImage wurde nicht gefunden.');
      return;
    }

    if (button.dataset.exportBound === 'true') {
      return;
    }

    button.textContent = 'Karte als JPG herunterladen';

    button.addEventListener('click', function () {
      downloadMapBlockAsImage();
    });

    button.dataset.exportBound = 'true';
  }

  /*
    ============================================================
    START
    ============================================================
  */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initMapExportButton);
  } else {
    initMapExportButton();
  }
})();
</script>
