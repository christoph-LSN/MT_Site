<!-- html2canvas laden -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
(function () {
  'use strict';

  /*
    ============================================================
    1) DATEINAMEN AUS DEM TITEL ERZEUGEN
    ============================================================
  */
  function getMapFileName() {
    const heading = document.getElementById('map-heading');

    if (!heading) {
      return 'karte.png';
    }

    const cleanName = heading.textContent
      .trim()
      .toLowerCase()
      .replace(/[^\wäöüß\- ]/gi, '')
      .replace(/\s+/g, '-');

    return cleanName + '.png';
  }

  /*
    ============================================================
    2) DOWNLOAD AUS EINEM CANVAS STARTEN
    ============================================================
  */
  function downloadCanvas(canvas, filename) {
    canvas.toBlob(function (blob) {
      if (!blob) {
        alert('Die PNG-Datei konnte nicht erzeugt werden.');
        return;
      }

      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');

      link.href = url;
      link.download = filename;

      document.body.appendChild(link);
      link.click();
      link.remove();

      URL.revokeObjectURL(url);
    }, 'image/png');
  }

  /*
    ============================================================
    3) KURZ WARTEN
    ============================================================
    Kleine Hilfsfunktion, damit wir dem Browser Zeit geben können,
    z. B. wenn wir vor dem Export kurz Elemente ausblenden.
  */
  function wait(ms) {
    return new Promise(function (resolve) {
      setTimeout(resolve, ms);
    });
  }

  /*
    ============================================================
    4) PRÜFEN, OB LEAFLET-TILES GELADEN SIND
    ============================================================
    Damit der Kartenhintergrund möglichst vollständig im Export landet,
    warten wir kurz darauf, dass die Kachelbilder geladen sind.
  */
  async function waitForLeafletTiles(container, timeoutMs) {
    const start = Date.now();

    while (Date.now() - start < timeoutMs) {
      const images = container.querySelectorAll('.leaflet-tile');

      if (images.length === 0) {
        // Noch keine Tiles gefunden -> kurz weiter warten
        await wait(200);
        continue;
      }

      let allLoaded = true;

      images.forEach(function (img) {
        if (!img.complete) {
          allLoaded = false;
        }
      });

      if (allLoaded) {
        return true;
      }

      await wait(200);
    }

    return false;
  }

  /*
    ============================================================
    5) INTERAKTIVE MAP-CONTROLS VORÜBERGEHEND AUSBLENDEN
    ============================================================
    Die Legende soll bleiben, Zoom/Search/Attribution/Time-Control
    dagegen möglichst nicht im Export erscheinen.
  */
  function hideMapControlsForExport() {
    const selectors = [
      '.leaflet-control-zoom',
      '.leaflet-control-search',
      '.leaflet-control-fullscreen',
      '.leaflet-control-attribution',
      '.leaflet-bar.timecontrol',
      '.leaflet-control-timecontrol',
      '.leaflet-control-container .leaflet-top.leaflet-left .leaflet-control:not(.legend)',
      '.leaflet-control-container .leaflet-bottom.leaflet-left .leaflet-control',
      '.leaflet-control-container .leaflet-bottom.leaflet-right .leaflet-control'
    ];

    const hiddenElements = [];

    selectors.forEach(function (selector) {
      document.querySelectorAll(selector).forEach(function (el) {
        // Elemente mit echter Legendenklasse nicht verstecken
        if (el.classList.contains('legend')) return;
        if (el.closest('.legend')) return;

        hiddenElements.push({
          element: el,
          oldDisplay: el.style.display
        });

        el.style.display = 'none';
      });
    });

    return hiddenElements;
  }

  /*
    ============================================================
    6) AUSGEBLENDETE CONTROLS WIEDER SICHTBAR MACHEN
    ============================================================
  */
  function restoreHiddenElements(hiddenElements) {
    hiddenElements.forEach(function (entry) {
      entry.element.style.display = entry.oldDisplay;
    });
  }

  /*
    ============================================================
    7) TILE-BILDER FÜR CORS VORBEREITEN
    ============================================================
    Das hilft html2canvas dabei, externe Kartenkacheln mit zu rendern.
    Wichtig: Das funktioniert nur, wenn der Tile-Server CORS erlaubt.
  */
  function prepareTileImagesForExport(container) {
    const tileImages = container.querySelectorAll('.leaflet-tile');

    tileImages.forEach(function (img) {
      try {
        img.setAttribute('crossorigin', 'anonymous');
      } catch (e) {
        // Falls das Setzen fehlschlägt, ignorieren wir es
      }
    });
  }

  /*
    ============================================================
    8) HAUPTFUNKTION: GESAMTEN KARTENBLOCK EXPORTIEREN
    ============================================================
  */
  async function downloadMapBlockAsPng() {
    const exportWrapper = document.getElementById('map-export-wrapper');
    const mapContainer = document.getElementById('map');

    if (!exportWrapper) {
      alert('Der Export-Bereich #map-export-wrapper wurde nicht gefunden.');
      return;
    }

    if (!mapContainer) {
      alert('Der Kartenbereich #map wurde nicht gefunden.');
      return;
    }

    if (typeof html2canvas === 'undefined') {
      alert('html2canvas wurde nicht geladen.');
      return;
    }

    // Vorbereiten
    prepareTileImagesForExport(mapContainer);

    // Warten, bis Kartenkacheln möglichst geladen sind
    await waitForLeafletTiles(mapContainer, 4000);

    // Interaktive Controls ausblenden
    const hiddenElements = hideMapControlsForExport();

    // Dem Browser kurz Zeit geben, damit die Anzeige aktualisiert wird
    await wait(250);

    try {
      const canvas = await html2canvas(exportWrapper, {
        backgroundColor: '#ffffff',
        scale: 2,
        useCORS: true,
        allowTaint: false,
        logging: false,
        foreignObjectRendering: false
      });

      downloadCanvas(canvas, getMapFileName());
    } catch (error) {
      console.error(error);
      alert('Der Kartenbereich konnte nicht als Bild exportiert werden.');
    } finally {
      // Controls wieder einblenden
      restoreHiddenElements(hiddenElements);
    }
  }

  /*
    ============================================================
    9) BUTTON MIT DER EXPORT-FUNKTION VERBINDEN
    ============================================================
  */
  function initMapExportButton() {
    const button = document.getElementById('btnSaveMapImage');

    if (!button) {
      console.warn('Button #btnSaveMapImage wurde nicht gefunden.');
      return;
    }

    button.addEventListener('click', downloadMapBlockAsPng);
  }

  /*
    ============================================================
    10) STARTPUNKT
    ============================================================
  */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initMapExportButton);
  } else {
    initMapExportButton();
  }
})();
</script>
