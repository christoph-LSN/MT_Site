     Falls DataTables-Buttons an anderer Stelle im Projekt
     benötigt werden, können diese Bibliotheken bleiben.

<script src="https://cdn.datatables.net/buttons/2.2.3/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.2.3/js/buttons.print.min.js"></script>

<!-- =========================================================
     Nur diese beiden Bibliotheken für den Kartenexport:
     - html2canvas: für die Legende
     - leaflet-image: für die Karte selbst
     ========================================================= -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://unpkg.com/leaflet-image/leaflet-image.js"></script>

<style>
  /* =========================================================
     EXPORTBLOCK
     ========================================================= */
  #map-export-wrapper {
    background: #ffffff;
    padding: 20px;
  }

  #map-export-header {
    margin-bottom: 20px;
  }

  #map-export-wrapper .map-title {
    margin-top: 0;
    margin-bottom: 20px;
    font-size: 2rem;
    line-height: 1.3;
  }

  #map-export-source {
    margin-top: 16px;
    font-size: 0.95rem;
    line-height: 1.4;
    word-break: break-word;
  }

  /* =========================================================
     AKTIONSLEISTE: Buttons nebeneinander + grün
     ========================================================= */
  #map-action-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 16px;
    align-items: center;
  }

  #map-action-row .btn,
  #map-action-row button,
  #map-action-row a,
  #mapSelectionDownload,
  #mapSelectionDownload .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  #map-action-row .btn,
  #map-action-row button,
  #map-action-row a {
    min-height: 42px;
    padding: 8px 16px;
    border: 1px solid #00843d;
    background-color: #00843d;
    color: #ffffff !important;
    text-decoration: none !important;
    border-radius: 0;
    cursor: pointer;
    font-size: 1rem;
    line-height: 1.2;
  }

  #map-action-row .btn:hover,
  #map-action-row button:hover,
  #map-action-row a:hover {
    background-color: #006c32;
    border-color: #006c32;
    color: #ffffff !important;
  }

  #map-action-row .btn:disabled,
  #map-action-row button:disabled {
    opacity: 0.75;
    cursor: wait;
  }
</style>

<script>
(function () {
  'use strict';

  /* =========================================================
     KONFIGURATION
     ========================================================= */
  var EXPORT_SCALE = 1;
  var JPEG_QUALITY = 0.86;
  var TILE_WAIT_TIMEOUT = 2500;
  var PAGE_PADDING = 20;
  var TITLE_FONT = 'normal 28px Arial, sans-serif';
  var BODY_FONT = 'normal 14px Arial, sans-serif';
  var SOURCE_FONT = 'normal 14px Arial, sans-serif';
  var TEXT_COLOR = '#222222';
  var SOURCE_COLOR = '#1a5fb4';

  /* =========================================================
     LEAFLET-MAPS EINFANGEN
     Falls die Karte nach dem Laden dieses Skripts erzeugt wird,
     merken wir uns die Map-Instanzen.
     ========================================================= */
  window.__capturedLeafletMaps = window.__capturedLeafletMaps || [];

  function installLeafletMapCapture() {
    if (!window.L || !window.L.map || window.__leafletMapCaptureInstalled) {
      return;
    }

    var originalMapFactory = window.L.map;

    window.L.map = function () {
      var map = originalMapFactory.apply(this, arguments);
      try {
        window.__capturedLeafletMaps.push(map);
      } catch (e) {
        // absichtlich leer
      }
      return map;
    };

    window.__leafletMapCaptureInstalled = true;
  }

  installLeafletMapCapture();

  /* =========================================================
     HILFSFUNKTIONEN
     ========================================================= */
  function wait(ms) {
    return new Promise(function (resolve) {
      setTimeout(resolve, ms);
    });
  }

  function getMapFileName() {
    var heading = document.getElementById('map-heading');

    if (!heading) {
      return 'karte.jpg';
    }

    var cleanName = heading.textContent
      .trim()
      .toLowerCase()
      .replace(/[^\wäöüß\- ]/gi, '')
      .replace(/\s+/g, '-');

    return cleanName + '.jpg';
  }

  function getTextFromElement(selector) {
    var el = document.querySelector(selector);
    return el ? el.innerText.trim() : '';
  }

  function getFootnoteText() {
    var footer = document.getElementById('mapFooter');
    if (!footer) return '';

    var clone = footer.cloneNode(true);

    /*
      Sicherheitshalber alle Buttons/Links/Formularelemente entfernen,
      damit nichts wie "im GeoJSON-Format speichern" im Text landet.
    */
    var removable = clone.querySelectorAll(
      'button, .btn, a.btn, input[type="button"], input[type="submit"]'
    );

    removable.forEach(function (el) {
      el.remove();
    });

    return clone.innerText.trim();
  }

  function prepareTileImagesForExport(container) {
    var tiles = container.querySelectorAll('.leaflet-tile');

    tiles.forEach(function (img) {
      try {
        img.crossOrigin = 'anonymous';
        img.setAttribute('crossorigin', 'anonymous');
      } catch (e) {
        // absichtlich leer
      }
    });
  }

  async function waitForLeafletTiles(container, timeoutMs) {
    var start = Date.now();

    while (Date.now() - start < timeoutMs) {
      var images = container.querySelectorAll('.leaflet-tile');

      if (images.length === 0) {
        await wait(150);
        continue;
      }

      var loaded = 0;
      images.forEach(function (img) {
        if (img.complete) {
          loaded++;
        }
      });

      if (loaded / images.length > 0.9) {
        return true;
      }

      await wait(150);
    }

    return false;
  }

  /*
    Sucht eine sichtbare Legende innerhalb des Kartenbereichs.
    Falls keine Legende gefunden wird, wird null zurückgegeben.
  */
  function findLegendElement() {
    var candidates = document.querySelectorAll(
      '#map .legend, ' +
      '#map .map-legend, ' +
      '#map .leaflet-control.legend, ' +
      '#map .leaflet-control .legend, ' +
      '#map .info.legend, ' +
      '#map .leaflet-top.leaflet-right .leaflet-control'
    );

    for (var i = 0; i < candidates.length; i++) {
      var el = candidates[i];
      var rect = el.getBoundingClientRect();
      var style = window.getComputedStyle(el);

      if (
        rect.width > 20 &&
        rect.height > 20 &&
        style.display !== 'none' &&
        style.visibility !== 'hidden'
      ) {
        return el;
      }
    }

    return null;
  }

  /*
    Versucht, die Leaflet-Map-Instanz zu finden.
    1) zuerst bereits eingefangene Maps
    2) dann globale Window-Variablen
    3) dann flache Suche in globalen Objekten
  */
  function findLeafletMapInstance() {
    var mapContainer = document.getElementById('map');

    if (!mapContainer || !window.L || !window.L.Map) {
      return null;
    }

    // 1) bereits gespeicherte Maps bevorzugen
    if (window.__capturedLeafletMaps.length) {
      for (var i = window.__capturedLeafletMaps.length - 1; i >= 0; i--) {
        var storedMap = window.__capturedLeafletMaps[i];
        if (
          storedMap &&
          storedMap.getContainer &&
          storedMap.getContainer() === mapContainer
        ) {
          return storedMap;
        }
      }

      // Falls kein Container-Match: letzte bekannte Karte als Fallback
      return window.__capturedLeafletMaps[window.__capturedLeafletMaps.length - 1];
    }

    // 2) globale Variablen durchsuchen
    for (var key in window) {
      try {
        var value = window[key];
        if (value instanceof window.L.Map) {
          if (value.getContainer && value.getContainer() === mapContainer) {
            return value;
          }
        }
      } catch (e) {
        // ignorieren
      }
    }

    // 3) flache Suche in globalen Objekten
    for (var key2 in window) {
      try {
        var obj = window[key2];
        if (!obj || typeof obj !== 'object') {
          continue;
        }

        for (var subKey in obj) {
          try {
            var candidate = obj[subKey];
            if (candidate instanceof window.L.Map) {
              if (candidate.getContainer && candidate.getContainer() === mapContainer) {
                return candidate;
              }
            }
          } catch (e) {
            // ignorieren
          }
        }
      } catch (e) {
        // ignorieren
      }
    }

    return null;
  }

  /*
    Text im Canvas umbrechen
  */
  function wrapText(ctx, text, x, y, maxWidth, lineHeight, draw) {
    if (!text) {
      return y;
    }

    var paragraphs = text.split('\n');
    var currentY = y;

    paragraphs.forEach(function (paragraph, paragraphIndex) {
      var words = paragraph.split(/\s+/);
      var line = '';

      words.forEach(function (word) {
        var testLine = line ? line + ' ' + word : word;
        var metrics = ctx.measureText(testLine);

        if (metrics.width > maxWidth && line) {
          if (draw) {
            ctx.fillText(line, x, currentY);
          }
          currentY += lineHeight;
          line = word;
        } else {
          line = testLine;
        }
      });

      if (line) {
        if (draw) {
          ctx.fillText(line, x, currentY);
        }
        currentY += lineHeight;
      }

      if (paragraphIndex < paragraphs.length - 1) {
        currentY += 4;
      }
    });

    return currentY;
  }

  function measureWrappedTextHeight(ctx, text, maxWidth, lineHeight) {
    var startY = 0;
    var endY = wrapText(ctx, text, 0, startY, maxWidth, lineHeight, false);
    return endY - startY;
  }

  /*
    Legende separat als Canvas rendern
  */
  async function renderLegendCanvas(legendElement) {
    if (!legendElement || typeof html2canvas === 'undefined') {
      return null;
    }

    return await html2canvas(legendElement, {
      backgroundColor: null,
      scale: 1,
      useCORS: true,
      allowTaint: false,
      logging: false
    });
  }

  /*
    Karte exakt mit leaflet-image rendern
  */
  function renderLeafletMapCanvas(map) {
    return new Promise(function (resolve, reject) {
      if (!window.leafletImage) {
        reject(new Error('leaflet-image wurde nicht geladen.'));
        return;
      }

      window.leafletImage(map, function (err, canvas) {
        if (err) {
          reject(err);
          return;
        }
        resolve(canvas);
      });
    });
  }

  /*
    Download starten
  */
  function downloadCanvasAsJpeg(canvas, filename) {
    return new Promise(function (resolve, reject) {
      try {
        canvas.toBlob(function (blob) {
          if (!blob) {
            reject(new Error('Kein Blob erzeugt.'));
            return;
          }

          var url = URL.createObjectURL(blob);
          var link = document.createElement('a');

          link.href = url;
          link.download = filename;

          document.body.appendChild(link);
          link.click();
          link.remove();

          setTimeout(function () {
            URL.revokeObjectURL(url);
          }, 1000);

          resolve(true);
        }, 'image/jpeg', JPEG_QUALITY);
      } catch (error) {
        reject(error);
      }
    });
  }

  /* =========================================================
     HAUPTEXPORT
     ========================================================= */
  async function downloadMapAsJpeg() {
    var button = document.getElementById('btnSaveMapImage');
    var mapContainer = document.getElementById('map');

    if (!mapContainer) {
      alert('Der Kartencontainer #map wurde nicht gefunden.');
      return;
    }

    var map = findLeafletMapInstance();

    if (!map) {
      alert(
        'Die Leaflet-Karteninstanz konnte nicht gefunden werden.\n\n' +
        'Wenn diese Meldung erscheint, muss die Map-Erzeugung einmal gezielt ' +
        'an das Exportskript angebunden werden.'
      );
      return;
    }

    if (button) {
      button.disabled = true;
      button.textContent = 'Export läuft...';
    }

    try {
      prepareTileImagesForExport(mapContainer);
      await waitForLeafletTiles(mapContainer, TILE_WAIT_TIMEOUT);

      var mapRect = mapContainer.getBoundingClientRect();
      var titleText = getTextFromElement('#map-heading');
      var footnoteText = getFootnoteText();
      var sourceText = getTextFromElement('#map-source-text');
      var legendElement = findLegendElement();

      // 1) Karte exakt rendern
      var mapCanvas = await renderLeafletMapCanvas(map);

      // 2) Legende separat rendern (wenn vorhanden)
      var legendCanvas = null;
      var legendRect = null;

      if (legendElement) {
        legendCanvas = await renderLegendCanvas(legendElement);
        legendRect = legendElement.getBoundingClientRect();
      }

      // 3) Finales Canvas zusammenbauen
      var exportWidth = Math.max(1000, Math.round(mapRect.width) + PAGE_PADDING * 2);
      var contentWidth = exportWidth - PAGE_PADDING * 2;
      var drawScale = contentWidth / mapCanvas.width;
      var finalMapWidth = Math.round(mapCanvas.width * drawScale);
      var finalMapHeight = Math.round(mapCanvas.height * drawScale);

      // Höhen vorab sauber berechnen
      var measureCanvas = document.createElement('canvas');
      var measureCtx = measureCanvas.getContext('2d');

      var titleLineHeight = 36;
      var bodyLineHeight = 20;
      var sourceLineHeight = 20;

      measureCtx.font = TITLE_FONT;
      var titleHeight = measureWrappedTextHeight(measureCtx, titleText, contentWidth, titleLineHeight);

      measureCtx.font = BODY_FONT;
      var footnoteHeight = footnoteText
        ? measureWrappedTextHeight(measureCtx, footnoteText, contentWidth, bodyLineHeight)
        : 0;

      measureCtx.font = SOURCE_FONT;
      var sourceHeight = sourceText ? sourceLineHeight : 0;

      var exportHeight =
        PAGE_PADDING +                // oberer Rand
        titleHeight + 12 +            // Titel
        finalMapHeight +              // Karte
        24 +                          // Abstand zur Fußnote
        footnoteHeight +              // Fußnote
        (footnoteText ? 12 : 0) +     // Abstand nach Fußnote
        sourceHeight +                // Quelle
        PAGE_PADDING;                 // unterer Rand

      var finalCanvas = document.createElement('canvas');
      finalCanvas.width = Math.round(exportWidth * EXPORT_SCALE);
      finalCanvas.height = Math.round(exportHeight * EXPORT_SCALE);

      var ctx = finalCanvas.getContext('2d');
      ctx.scale(EXPORT_SCALE, EXPORT_SCALE);

      // Hintergrund
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, exportWidth, exportHeight);

      // Titel
      var currentY = PAGE_PADDING;
      ctx.fillStyle = TEXT_COLOR;
      ctx.font = TITLE_FONT;
      currentY = wrapText(ctx, titleText, PAGE_PADDING, currentY + 28, contentWidth, titleLineHeight, true);
      currentY += 12;

      // Karte
      var mapX = PAGE_PADDING;
      var mapY = currentY;
      ctx.drawImage(mapCanvas, mapX, mapY, finalMapWidth, finalMapHeight);

      // Legende an die richtige Stelle auf die Karte legen
      if (legendCanvas && legendRect) {
        var relativeLeft = legendRect.left - mapRect.left;
        var relativeTop = legendRect.top - mapRect.top;

        var drawLegendX = mapX + Math.round(relativeLeft * drawScale);
        var drawLegendY = mapY + Math.round(relativeTop * drawScale);
        var drawLegendW = Math.round(legendRect.width * drawScale);
        var drawLegendH = Math.round(legendRect.height * drawScale);

        ctx.drawImage(
          legendCanvas,
          drawLegendX,
          drawLegendY,
          drawLegendW,
          drawLegendH
        );
      }

      currentY = mapY + finalMapHeight + 24;

      // Fußnote
      if (footnoteText) {
        ctx.fillStyle = TEXT_COLOR;
        ctx.font = BODY_FONT;
        currentY = wrapText(ctx, footnoteText, PAGE_PADDING, currentY, contentWidth, bodyLineHeight, true);
        currentY += 12;
      }

      // Quelle
      if (sourceText) {
        ctx.fillStyle = TEXT_COLOR;
        ctx.font = 'bold 14px Arial, sans-serif';
        ctx.fillText('Quelle:', PAGE_PADDING, currentY);

        var labelWidth = ctx.measureText('Quelle:').width + 6;

        ctx.font = SOURCE_FONT;
        ctx.fillStyle = SOURCE_COLOR;
        ctx.fillText(sourceText, PAGE_PADDING + labelWidth, currentY);

        // leichte Unterstreichung im Stil eines Links
        var sourceWidth = ctx.measureText(sourceText).width;
        ctx.beginPath();
        ctx.moveTo(PAGE_PADDING + labelWidth, currentY + 3);
        ctx.lineTo(PAGE_PADDING + labelWidth + sourceWidth, currentY + 3);
        ctx.strokeStyle = SOURCE_COLOR;
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      await downloadCanvasAsJpeg(finalCanvas, getMapFileName());

    } catch (error) {
      console.error('Exportfehler:', error);
      alert(
        'Der Kartenexport konnte nicht abgeschlossen werden.\n\n' +
        'Bitte prüfe die Browser-Konsole. ' +
        'Typische Ursachen sind externe Kartenkacheln oder eine nicht auffindbare Leaflet-Map.'
      );
    } finally {
      if (button) {
        button.disabled = false;
        button.textContent = 'Karte als JPEG herunterladen';
      }
    }
  }

  /* =========================================================
     INITIALISIERUNG
     ========================================================= */
  function initMapExport() {
    installLeafletMapCapture();

    var button = document.getElementById('btnSaveMapImage');
    if (!button) {
      console.warn('Button #btnSaveMapImage wurde nicht gefunden.');
      return;
    }

    if (button.dataset.exportBound === 'true') {
      return;
    }

    button.textContent = 'Karte als JPEG herunterladen';
    button.addEventListener('click', function () {
      downloadMapAsJpeg();
    });

    button.dataset.exportBound = 'true';
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initMapExport);
  } else {
    initMapExport();
  }
})();
</script>
