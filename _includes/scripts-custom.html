<!-- Falls DataTables-Buttons an anderer Stelle im Projekt benötigt werden -->
<script src="https://cdn.datatables.net/buttons/2.2.3/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.2.3/js/buttons.print.min.js"></script>

<style>
  /* =========================================================
     EXPORTBLOCK
     ========================================================= */
  #map-export-wrapper {
    background: #ffffff;
    padding: 20px;
  }

  #map-export-header {
    margin-bottom: 20px;
  }

  #map-export-wrapper .map-title {
    margin-top: 0;
    margin-bottom: 20px;
    font-size: 2rem;
    line-height: 1.3;
  }

  #map-export-source {
    margin-top: 16px;
    font-size: 0.95rem;
    line-height: 1.4;
    word-break: break-word;
  }

  /* =========================================================
     AKTIONSLEISTE: Buttons nebeneinander + grün
     ========================================================= */
  #map-action-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 16px;
    align-items: center;
  }

  #map-action-row .btn,
  #map-action-row button,
  #map-action-row a,
  #mapSelectionDownload,
  #mapSelectionDownload .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  #map-action-row .btn,
  #map-action-row button,
  #map-action-row a {
    min-height: 42px;
    padding: 8px 16px;
    border: 1px solid #00843d;
    background-color: #00843d;
    color: #ffffff !important;
    text-decoration: none !important;
    border-radius: 0;
    cursor: pointer;
    font-size: 1rem;
    line-height: 1.2;
  }

  #map-action-row .btn:hover,
  #map-action-row button:hover,
  #map-action-row a:hover {
    background-color: #006c32;
    border-color: #006c32;
    color: #ffffff !important;
  }

  #map-action-row .btn:disabled,
  #map-action-row button:disabled {
    opacity: 0.75;
    cursor: wait;
  }
</style>

<script>
(function () {
  'use strict';

  var JPEG_QUALITY = 0.88;

  function wait(ms) {
    return new Promise(function (resolve) {
      setTimeout(resolve, ms);
    });
  }

  function getMapFileName() {
    var heading = document.getElementById('map-heading');

    if (!heading) {
      return 'karte.jpg';
    }

    var cleanName = heading.textContent
      .trim()
      .toLowerCase()
      .replace(/[^\wäöüß\- ]/gi, '')
      .replace(/\s+/g, '-');

    return cleanName + '.jpg';
  }

  function downloadBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');

    link.href = url;
    link.download = filename;

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(function () {
      URL.revokeObjectURL(url);
    }, 1000);
  }

  async function captureElementFromCurrentTab(element) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
      throw new Error('Die Screen-Capture-API wird in diesem Browser nicht unterstützt.');
    }

    /*
      Wichtig:
      Der Browser zeigt einen Freigabedialog.
      Dort muss der aktuelle Tab ausgewählt werden.
    */
    var stream = await navigator.mediaDevices.getDisplayMedia({
      video: {
        frameRate: 1
      },
      audio: false
    });

    var video = document.createElement('video');
    video.style.position = 'fixed';
    video.style.left = '-10000px';
    video.style.top = '-10000px';
    video.muted = true;
    video.playsInline = true;
    video.srcObject = stream;

    document.body.appendChild(video);

    try {
      await video.play();

      /*
        Kurze Wartezeit, damit der erste saubere Frame verfügbar ist.
      */
      await wait(300);

      var fullWidth = video.videoWidth;
      var fullHeight = video.videoHeight;

      if (!fullWidth || !fullHeight) {
        throw new Error('Der Screenshot-Frame konnte nicht gelesen werden.');
      }

      var fullCanvas = document.createElement('canvas');
      fullCanvas.width = fullWidth;
      fullCanvas.height = fullHeight;

      var fullCtx = fullCanvas.getContext('2d');
      fullCtx.drawImage(video, 0, 0, fullWidth, fullHeight);

      /*
        Elementposition relativ zum aktuellen Viewport bestimmen
      */
      var rect = element.getBoundingClientRect();

      /*
        Verhältnis zwischen Video-Pixeln und CSS-Pixeln bestimmen
      */
      var scaleX = fullWidth / window.innerWidth;
      var scaleY = fullHeight / window.innerHeight;

      var cropX = Math.max(0, Math.round(rect.left * scaleX));
      var cropY = Math.max(0, Math.round(rect.top * scaleY));
      var cropWidth = Math.min(fullWidth - cropX, Math.round(rect.width * scaleX));
      var cropHeight = Math.min(fullHeight - cropY, Math.round(rect.height * scaleY));

      if (cropWidth <= 0 || cropHeight <= 0) {
        throw new Error('Der auszuschneidende Bereich ist ungültig.');
      }

      var croppedCanvas = document.createElement('canvas');
      croppedCanvas.width = cropWidth;
      croppedCanvas.height = cropHeight;

      var croppedCtx = croppedCanvas.getContext('2d');
      croppedCtx.drawImage(
        fullCanvas,
        cropX, cropY, cropWidth, cropHeight,
        0, 0, cropWidth, cropHeight
      );

      return croppedCanvas;

    } finally {
      /*
        Stream immer sauber beenden
      */
      if (stream) {
        stream.getTracks().forEach(function (track) {
          track.stop();
        });
      }

      if (video && video.parentNode) {
        video.parentNode.removeChild(video);
      }
    }
  }

  async function downloadCurrentMapScreenshot() {
    var button = document.getElementById('btnSaveMapImage');
    var exportWrapper = document.getElementById('map-export-wrapper');

    if (!exportWrapper) {
      alert('Der Export-Bereich #map-export-wrapper wurde nicht gefunden.');
      return;
    }

    if (button) {
      button.disabled = true;
      button.textContent = 'Tab-Freigabe auswählen...';
    }

    try {
      /*
        Damit der Benutzer genau weiß, was zu tun ist:
        Der Browser zeigt jetzt die Freigabeauswahl.
      */
      var canvas = await captureElementFromCurrentTab(exportWrapper);

      await new Promise(function (resolve, reject) {
        canvas.toBlob(function (blob) {
          if (!blob) {
            reject(new Error('Das JPEG konnte nicht erzeugt werden.'));
            return;
          }

          downloadBlob(blob, getMapFileName());
          resolve(true);
        }, 'image/jpeg', JPEG_QUALITY);
      });

    } catch (error) {
      console.error('Screenshot-Exportfehler:', error);

      alert(
        'Der Screenshot konnte nicht erstellt werden.\n\n' +
        'Bitte beim Freigabedialog den aktuellen Browser-Tab auswählen.\n' +
        'Wenn der Vorgang abgebrochen wurde, kann kein Bild gespeichert werden.'
      );
    } finally {
      if (button) {
        button.disabled = false;
        button.textContent = 'Karte als JPEG herunterladen';
      }
    }
  }

  function initMapExport() {
    var button = document.getElementById('btnSaveMapImage');

    if (!button) {
      console.warn('Button #btnSaveMapImage wurde nicht gefunden.');
      return;
    }

    if (button.dataset.exportBound === 'true') {
      return;
    }

    button.textContent = 'Karte als JPEG herunterladen';

    button.addEventListener('click', function () {
      downloadCurrentMapScreenshot();
    });

    button.dataset.exportBound = 'true';
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initMapExport);
  } else {
    initMapExport();
  }
})();
</script>
