<!-- html2canvas für DOM-/Container-Export laden -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
  /*
    Der Exportbereich bekommt einen weißen Hintergrund und etwas Innenabstand,
    damit das Ergebnis optisch eher dem Grafik-Download entspricht.
  */
  #map-export-wrapper {
    background: #ffffff;
    padding: 20px;
  }

  #map-export-wrapper .map-title {
    margin-top: 0;
    margin-bottom: 20px;
  }

  /*
    Optional: sorgt dafür, dass der Download-Button etwas Abstand hat.
  */
  #map-image-download {
    margin-top: 1rem;
  }
</style>

<script>
(function () {
  'use strict';

  /*
    ============================================================
    1) DATEINAMEN AUS DEM KARTENTITEL ERZEUGEN
    ============================================================
  */
  function getMapFileName() {
    const heading = document.getElementById('map-heading');

    if (!heading) {
      return 'karte.png';
    }

    const cleanName = heading.textContent
      .trim()
      .toLowerCase()
      .replace(/[^\wäöüß\- ]/gi, '') // viele Sonderzeichen entfernen
      .replace(/\s+/g, '-');         // Leerzeichen durch Bindestriche ersetzen

    return cleanName + '.png';
  }

  /*
    ============================================================
    2) DOWNLOAD AUS EINEM CANVAS STARTEN
    ============================================================
  */
  function downloadCanvas(canvas, filename) {
    canvas.toBlob(function (blob) {
      if (!blob) {
        alert('Die PNG-Datei konnte nicht erzeugt werden.');
        return;
      }

      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');

      link.href = url;
      link.download = filename;

      document.body.appendChild(link);
      link.click();
      link.remove();

      URL.revokeObjectURL(url);
    }, 'image/png');
  }

  /*
    ============================================================
    3) KLEINE WARTEFUNKTION
    ============================================================
    Hilft, damit der Browser Zeit hat, Änderungen im DOM sichtbar
    umzusetzen, bevor html2canvas den Bereich rendert.
  */
  function wait(ms) {
    return new Promise(function (resolve) {
      setTimeout(resolve, ms);
    });
  }

  /*
    ============================================================
    4) WARTEN, BIS LEAFLET-TILES GELADEN SIND
    ============================================================
    Damit der Hintergrund der Karte möglichst vollständig erscheint,
    warten wir kurz auf die Kartenkacheln.
  */
  async function waitForLeafletTiles(container, timeoutMs) {
    const start = Date.now();

    while (Date.now() - start < timeoutMs) {
      const images = container.querySelectorAll('.leaflet-tile');

      // Falls noch keine Tiles vorhanden sind, kurz weiter warten
      if (images.length === 0) {
        await wait(200);
        continue;
      }

      let allLoaded = true;

      images.forEach(function (img) {
        if (!img.complete) {
          allLoaded = false;
        }
      });

      if (allLoaded) {
        return true;
      }

      await wait(200);
    }

    return false;
  }

  /*
    ============================================================
    5) INTERAKTIVE LEAFLET-STEUERELEMENTE AUSBLENDEN
    ============================================================
    Diese Elemente sollen beim Export möglichst nicht erscheinen:
    - Zoom
    - Suche
    - Fullscreen
    - Attribution
    - Time-Control / Slider / Playback
    Die Legende soll möglichst stehen bleiben.
  */
  function hideMapControlsForExport() {
    const selectors = [
      '.leaflet-control-zoom',
      '.leaflet-control-search',
      '.leaflet-control-fullscreen',
      '.leaflet-control-attribution',
      '.leaflet-bar.timecontrol',
      '.leaflet-control-timecontrol',
      '.leaflet-control-container .leaflet-bottom.leaflet-left .leaflet-control',
      '.leaflet-control-container .leaflet-bottom.leaflet-right .leaflet-control'
    ];

    const hiddenElements = [];

    selectors.forEach(function (selector) {
      document.querySelectorAll(selector).forEach(function (el) {
        /*
          Elemente mit Klassen, die wahrscheinlich eine Legende darstellen,
          NICHT ausblenden.
          Falls deine Legende andere Klassen hat, kannst du diese Bedingungen
          später erweitern.
        */
        if (el.classList.contains('legend')) return;
        if (el.classList.contains('map-legend')) return;
        if (el.classList.contains('info')) return;
        if (el.closest('.legend')) return;
        if (el.closest('.map-legend')) return;

        hiddenElements.push({
          element: el,
          oldDisplay: el.style.display
        });

        el.style.display = 'none';
      });
    });

    return hiddenElements;
  }

  /*
    ============================================================
    6) AUSGEBLENDETE ELEMENTE WIEDER SICHTBAR MACHEN
    ============================================================
  */
  function restoreHiddenElements(hiddenElements) {
    hiddenElements.forEach(function (entry) {
      entry.element.style.display = entry.oldDisplay;
    });
  }

  /*
    ============================================================
    7) TILE-BILDER FÜR DEN EXPORT VORBEREITEN
    ============================================================
    Das kann html2canvas helfen, externe Kartenbilder mitzunehmen.
    Wichtig: Das klappt nur, wenn der Tile-Server CORS erlaubt.
  */
  function prepareTileImagesForExport(container) {
    const tileImages = container.querySelectorAll('.leaflet-tile');

    tileImages.forEach(function (img) {
      try {
        img.setAttribute('crossorigin', 'anonymous');
      } catch (e) {
        // Falls das Setzen fehlschlägt, ignorieren wir das still
      }
    });
  }

  /*
    ============================================================
    8) HAUPTFUNKTION: GESAMTEN KARTENBLOCK ALS PNG EXPORTIEREN
    ============================================================
  */
  async function downloadMapBlockAsPng() {
    const exportWrapper = document.getElementById('map-export-wrapper');
    const mapContainer = document.getElementById('map');

    if (!exportWrapper) {
      alert('Der Export-Bereich #map-export-wrapper wurde nicht gefunden.');
      return;
    }

    if (!mapContainer) {
      alert('Der Kartenbereich #map wurde nicht gefunden.');
      return;
    }

    if (typeof html2canvas === 'undefined') {
      alert('html2canvas wurde nicht geladen.');
      return;
    }

    // Externe Tile-Bilder für den Export vorbereiten
    prepareTileImagesForExport(mapContainer);

    // Kurz warten, bis Kartenkacheln geladen sind
    await waitForLeafletTiles(mapContainer, 4000);

    // Interaktive Bedienelemente ausblenden
    const hiddenElements = hideMapControlsForExport();

    // Dem Browser kurz Zeit geben, die Änderungen sichtbar zu machen
    await wait(250);

    try {
      const canvas = await html2canvas(exportWrapper, {
        backgroundColor: '#ffffff',
        scale: 2,              // höhere Auflösung
        useCORS: true,         // wichtig für externe Bilder / Tiles
        allowTaint: false,
        logging: false,
        foreignObjectRendering: false,
        scrollX: 0,
        scrollY: 0,
        windowWidth: document.documentElement.scrollWidth,
        windowHeight: document.documentElement.scrollHeight
      });

      downloadCanvas(canvas, getMapFileName());
    } catch (error) {
      console.error(error);
      alert('Der Kartenbereich konnte nicht als Bild exportiert werden.');
    } finally {
      // Danach die Controls wieder sichtbar machen
      restoreHiddenElements(hiddenElements);
    }
  }

  /*
    ============================================================
    9) BUTTON MIT DER EXPORT-FUNKTION VERBINDEN
    ============================================================
  */
  function initMapExportButton() {
    const button = document.getElementById('btnSaveMapImage');

    if (!button) {
      console.warn('Button #btnSaveMapImage wurde nicht gefunden.');
      return;
    }

    /*
      Schutz davor, dass mehrfach dieselbe Event-Logik registriert wird,
      falls das Skript versehentlich mehr als einmal geladen wird.
    */
    if (button.dataset.exportBound === 'true') {
      return;
    }

    button.addEventListener('click', downloadMapBlockAsPng);
    button.dataset.exportBound = 'true';
  }

  /*
    ============================================================
    10) STARTPUNKT
    ============================================================
  */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initMapExportButton);
  } else {
    initMapExportButton();
  }
})();
</script>
