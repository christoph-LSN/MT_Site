<script>
(function () {
  'use strict';

  /*
    ============================================================
    HILFSFUNKTION: Dateinamen aus dem Kartentitel bauen
    ============================================================
  */
  function getMapFileName() {
    const heading = document.getElementById('map-heading');

    // Falls kein Titel gefunden wird, Standardname verwenden
    if (!heading) {
      return 'karte.png';
    }

    // Titel in Dateinamen umwandeln
    const cleanName = heading.textContent
      .trim()
      .toLowerCase()
      .replace(/[^\wäöüß\- ]/gi, '') // viele Sonderzeichen entfernen
      .replace(/\s+/g, '-');         // Leerzeichen durch Bindestriche ersetzen

    return cleanName + '.png';
  }

  /*
    ============================================================
    HILFSFUNKTION: Download starten
    ============================================================
  */
  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');

    link.href = url;
    link.download = filename;

    document.body.appendChild(link);
    link.click();
    link.remove();

    URL.revokeObjectURL(url);
  }

  /*
    ============================================================
    HAUPTFUNKTION: Leaflet-Karte als PNG speichern
    ============================================================

    WICHTIG:
    Diese Funktion sucht innerhalb von #map nach einem SVG.
    Viele thematische Leaflet-Layer werden als SVG gerendert.
  */
  function downloadMapAsPng() {
    const mapContainer = document.getElementById('map');

    if (!mapContainer) {
      alert('Der Kartencontainer mit der ID "map" wurde nicht gefunden.');
      return;
    }

    /*
      Wir suchen nicht nur direkt in #map nach SVG,
      sondern im gesamten Unterbaum.
    */
    const svg = mapContainer.querySelector('svg');

    if (!svg) {
      alert('Es wurde keine SVG-Karte gefunden. Die Karte ist eventuell noch nicht vollständig geladen.');
      return;
    }

    // SVG klonen, damit das Original nicht verändert wird
    const clone = svg.cloneNode(true);

    // Wichtige Namespaces setzen
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');

    /*
      Breite und Höhe ermitteln
    */
    let width = svg.clientWidth || parseInt(svg.getAttribute('width'), 10);
    let height = svg.clientHeight || parseInt(svg.getAttribute('height'), 10);

    if ((!width || !height) && svg.viewBox && svg.viewBox.baseVal) {
      width = svg.viewBox.baseVal.width;
      height = svg.viewBox.baseVal.height;
    }

    if (!width || !height) {
      const bbox = svg.getBBox();
      width = bbox.width || 1200;
      height = bbox.height || 800;
    }

    clone.setAttribute('width', width);
    clone.setAttribute('height', height);

    /*
      SVG in Text umwandeln
    */
    const serializer = new XMLSerializer();
    let svgString = serializer.serializeToString(clone);

    if (!svgString.match(/^<\?xml/)) {
      svgString = '<?xml version="1.0" standalone="no"?>\r\n' + svgString;
    }

    /*
      SVG als Blob vorbereiten
    */
    const svgBlob = new Blob([svgString], {
      type: 'image/svg+xml;charset=utf-8'
    });

    const svgUrl = URL.createObjectURL(svgBlob);

    /*
      SVG als Bild laden
    */
    const img = new Image();

    img.onload = function () {
      const canvas = document.createElement('canvas');
      const scale = 2; // bessere Auflösung

      canvas.width = width * scale;
      canvas.height = height * scale;

      const ctx = canvas.getContext('2d');

      // Zeichenfläche skalieren
      ctx.setTransform(scale, 0, 0, scale, 0, 0);

      // Weißer Hintergrund
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, width, height);

      // SVG-Bild auf Canvas zeichnen
      ctx.drawImage(img, 0, 0, width, height);

      // Canvas als PNG exportieren
      canvas.toBlob(function (blob) {
        if (!blob) {
          alert('Das PNG konnte nicht erzeugt werden.');
          return;
        }

        downloadBlob(blob, getMapFileName());
      }, 'image/png');

      URL.revokeObjectURL(svgUrl);
    };

    img.onerror = function () {
      URL.revokeObjectURL(svgUrl);
      alert('Die SVG-Karte konnte nicht in ein Bild umgewandelt werden.');
    };

    img.src = svgUrl;
  }

  /*
    ============================================================
    BUTTON MIT FUNKTION VERBINDEN
    ============================================================
  */
  function initMapImageButton() {
    const button = document.getElementById('btnSaveMapImage');

    if (!button) {
      console.warn('Button #btnSaveMapImage wurde nicht gefunden.');
      return;
    }

    button.addEventListener('click', downloadMapAsPng);
  }

  /*
    ============================================================
    STARTEN, WENN DAS DOM GELADEN IST
    ============================================================
  */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initMapImageButton);
  } else {
    initMapImageButton();
  }
})();
</script>
